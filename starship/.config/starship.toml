palette = "tokyonight"

format = """
[](fg:bg_highlight bg:bg_dark)\
$os\
[](fg:bg_highlight bg:blue)\
$directory\
[](fg:blue bg:green)\
$git_branch\
$git_status\
[](fg:green bg:bg_dark)\
$fill\
[](fg:dark3 bg:bg_dark)\
$nodejs\
$rust\
$elixir\
$python\
$cmd_duration\
[](fg:bg_highlight bg:dark3)\
$time\
[](fg:bg_highlight bg:bg_dark)\
\n$character"""

[palettes.tokyonight]
bg_dark = "#1a1b26"
bg = "#24283b"
bg_highlight = "#292e42"
dark3 = "#414868"
fg = "#c0caf5"
fg_dark = "#a9b1d6"
blue = "#7aa2f7"
cyan = "#7dcfff"
green = "#9ece6a"
magenta = "#bb9af7"
red = "#f7768e"
yellow = "#e0af68"

[os]
disabled = false
style = "fg:blue bg:bg_highlight"
format = "[ $symbol ]($style)"

[os.symbols]
Macos = ""
Linux = "🐧"
Windows = ""

[directory]
style = "fg:bg_dark bg:blue bold"
format = "[ $path ]($style)"
truncation_length = 5
truncate_to_repo = false

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "fg:bg_dark bg:green"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "fg:bg_dark bg:green"
format = "[$conflicted$stashed$deleted$renamed$modified$staged$untracked$ahead_behind]($style)"
conflicted = "=${count} "
stashed = "📦${count} "
deleted = "✘${count} "
renamed = "»${count} "
modified = "!${count} "
staged = "+${count} "
untracked = "?${count} "
ahead = "⇡${count} "
behind = "⇣${count} "

[fill]
symbol = "─"
style = "fg:dark3"

[nodejs]
symbol = ""
style = "fg:cyan bg:dark3"
format = "[ $symbol $version ]($style)"

[rust]
symbol = ""
style = "fg:red bg:dark3"
format = "[ $symbol $version ]($style)"

[elixir]
symbol = ""
style = "fg:magenta bg:dark3"
format = "[ $symbol $version ]($style)"

[python]
symbol = ""
style = "fg:cyan bg:dark3"
format = "[ $symbol $version ]($style)"

[cmd_duration]
min_time = 2_000
style = "fg:yellow bg:dark3"
format = "[ 󱎫 $duration ]($style)"

[time]
disabled = false
time_format = "%R"
style = "fg:fg_dark bg:bg_highlight"
format = "[  $time ]($style)"

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"

